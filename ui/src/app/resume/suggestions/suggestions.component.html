<div class="suggestions-container">
  <h2 class="suggestions-title">Suggestions</h2>

  <div class="suggestions-list">
    @if (!suggestions.length) {
      <div class="no-suggestions">
        No suggestions available yet.
      </div>
    }

    @for (item of suggestions; track item) {
      <div class="suggestion-item">
        <p><strong>Original:</strong> {{ item.original_text }}</p>
        <p><strong>Suggested:</strong> {{ item.suggested_improvement }}</p>
        <p><strong>Reason: </strong>{{ item.reason }}</p>

        <div class="actions">
          @if (!item.isApplied) {
            <button class="btn-apply" (click)="applySuggestion(item)">Apply</button>
          } @else {
            <button class="btn-discard" (click)="discardSuggestion(item)">Discard</button>
          }

          <button class="btn-remove" (click)="removeSuggestion(item)">Remove</button>
        </div>
        <hr />
      </div>
    }
  </div>
</div>
